# pnpm settings for the infra package (single package, not a real workspace).

# Dependency build scripts only run when allowed here. esbuild's fetches its native binary,
# which CDK's NodejsFunction uses to bundle the Lambda.
allowBuilds:
  esbuild: true

# Refuse versions published in the last 24 h, a defence against freshly compromised releases.
minimumReleaseAge: 1440
