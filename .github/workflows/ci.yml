name: CI

on:
  pull_request:
  push:
    branches: [main]

# A PR's firmware is published to sandbox; a newer push to the same PR supersedes it. Main's runs
# (which publish to prod) are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-west-2
  # CRYPT-20: which secure element the published firmware uses. Prod takes only ATECC builds. ATECC
  # since CRYPT-29 (16 Oct 2026): images use the PCB's pins, so the camera dev board (BOARD=cam) is
  # updated by wire, never from these.
  FIRMWARE_KEYSTORE: atecc
  ESPTOOL_VERSION: "4.12.0"  # ESP-IDF v5.5's

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      watch: ${{ steps.filter.outputs.watch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            firmware:
              - 'embedded/**'
              - '.github/workflows/ci.yml'
            watch:
              - 'watch/TinycryptWatch/**'
              - 'watch/ci/**'
              - '.github/workflows/ci.yml'

  mac-sim:
    name: Mac sim + python-fido2
    runs-on: macos-latest
    defaults:
      run:
        working-directory: embedded
    steps:
      - uses: actions/checkout@v4

      - name: Fetch solo1 and the libraries it builds
        run: |
          git submodule update --init third_party/solo1
          git -C third_party/solo1 submodule update --init crypto/cifra crypto/micro-ecc crypto/tiny-AES-c tinycbor

      - name: Install libsodium and cJSON
        run: brew install libsodium cjson

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: embedded/tests/requirements.txt

      - name: Build the sim (INSECURE soft key)
        run: |
          cmake -S . -B build -DTINYCRYPT_INSECURE_SOFT_KEY=ON
          cmake --build build -j

      - name: CTAP2, signature interop and build-guard tests
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pytest -v tests

      # Compile check only: CI runners have no Secure Enclave to run it on.
      - name: Build the Secure Enclave vector generator
        working-directory: watch/tools/se-vector
        run: swift build

      - name: Build the BLE key stand-in
        working-directory: watch/tools/key-standin
        run: swift build

  watch-app:
    name: Watch app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      # Unsigned compile check; installing on a watch needs Martin's signing identity.
      - name: Build the iPhone app and the watch app it embeds
        working-directory: watch/TinycryptWatch
        run: |
          xcodegen generate
          xcodebuild -project TinycryptWatch.xcodeproj -scheme TinycryptWatch \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

  # ── Watch app to TestFlight (CRYPT-27) ───────────────────────────────────────────────────────
  # A PR that touches the watch app: the next version from the deployment tracker (project
  # tinycrypt-watch), archived and signed with CI's own Apple Distribution certificate and App
  # Store profiles, then uploaded to TestFlight. Distribution-signed, so the app gets prod APNs
  # pushes (the profile says aps-environment production). Nothing happens on merge: promoting a
  # TestFlight build is done in App Store Connect.
  watch-testflight:
    name: Watch app to TestFlight
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.watch == 'true'
    runs-on: macos-26
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SANDBOX_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Seed the version
        run: |
          printf '{"version": "0.1.0"}\n' > watch-version.json
      - name: Compute version
        id: version
        uses: nakomis/nakomis-infra/.github/actions/compute-version@main
        env:
          COMMIT_MESSAGE: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
        with:
          project: tinycrypt-watch
          environment: sandbox
          version-file: watch-version.json
      - name: Signing keychain, certificate and profiles
        run: |
          umask 077
          d="$RUNNER_TEMP/signing"; mkdir -p "$d"
          param() { aws ssm get-parameter --name "/tinycrypt/sandbox/apple/$1" --with-decryption --output json \
                    | python3 -c "import json,sys; sys.stdout.write(json.load(sys.stdin)['Parameter']['Value'])"; }
          param asc-key > "$d/asc.p8"
          param dist-key > "$d/dist.key"
          ASC_KEY_PATH="$d/asc.p8"
          ASC_KEY_ID=$(param asc-key-id)
          ASC_ISSUER_ID=$(param asc-issuer-id)
          export ASC_KEY_PATH ASC_KEY_ID ASC_ISSUER_ID
          printf 'ASC_KEY_PATH=%s\nASC_KEY_ID=%s\nASC_ISSUER_ID=%s\n' "$ASC_KEY_PATH" "$ASC_KEY_ID" "$ASC_ISSUER_ID" >> "$GITHUB_ENV"
          python3 -m venv "$d/venv" && "$d/venv/bin/pip" install --quiet cryptography
          "$d/venv/bin/python" watch/ci/asc.py cert "$d/dist.key" "$d/dist.cer"
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          for name in "tinycrypt CI iOS App Store" "tinycrypt CI watch App Store"; do
            "$d/venv/bin/python" watch/ci/asc.py profile "$name" "$d/p.mobileprovision"
            uuid=$(security cms -D -i "$d/p.mobileprovision" | plutil -extract UUID raw -)
            cp "$d/p.mobileprovision" "$profiles/$uuid.mobileprovision"
            cp "$d/p.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
          done
          # A throwaway keychain holding only the distribution identity, unlocked for codesign.
          pass=$(openssl rand -hex 24)
          openssl x509 -inform der -in "$d/dist.cer" -out "$d/dist.pem"
          # 3DES/SHA-1: macOS's security import can't read OpenSSL 3's default (AES, PBKDF2) PKCS#12.
          openssl pkcs12 -export -inkey "$d/dist.key" -in "$d/dist.pem" -passout "pass:$pass" \
            -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1 -out "$d/dist.p12"
          rm -f "$d/dist.key"
          kc="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p "$pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pass" "$kc"
          security import "$d/dist.p12" -k "$kc" -P "$pass" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$kc" > /dev/null
          # The existing search list, unquoted on purpose: one keychain path per word.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$d/dist.p12"
          security find-identity -v -p codesigning "$kc"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Archive
        working-directory: watch/TinycryptWatch
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          xcodegen generate
          # Distribution builds get pushes from production APNs (the profile allows only that).
          plutil -replace aps-environment -string production Resources/TinycryptWatch.entitlements
          plutil -replace aps-environment -string production Resources/TinycryptPhone.entitlements
          xcodebuild -project TinycryptWatch.xcodeproj -scheme TinycryptWatch -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/TinycryptWatch.xcarchive" \
            -xcconfig ../ci/ci-signing.xcconfig \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" archive
      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TinycryptWatch.xcarchive" \
            -exportOptionsPlist watch/ci/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::TinycryptWatch ${{ steps.version.outputs.version }} (${{ github.run_number }}.${{ github.run_attempt }}) uploaded to TestFlight"
      - name: Record deployment
        uses: nakomis/nakomis-infra/.github/actions/record-deployment@main
        with:
          project: tinycrypt-watch
          environment: sandbox
          version-file: watch-version.json
      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2> /dev/null || true
          rm -rf "$RUNNER_TEMP/signing"

  esp32s3:
    name: ESP32-S3 firmware
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    defaults:
      run:
        working-directory: embedded
    steps:
      - uses: actions/checkout@v4

      - name: Fetch solo1 and the libraries it builds
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init third_party/solo1
          git -C third_party/solo1 submodule update --init crypto/cifra crypto/micro-ecc crypto/tiny-AES-c tinycbor

      - name: Build soft-key test firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd esp32s3
          idf.py -DTINYCRYPT_INSECURE_SOFT_KEY=ON build

      - name: Release build must refuse the soft key
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd esp32s3
          if idf.py -B build-release -DTINYCRYPT_RELEASE=ON -DTINYCRYPT_INSECURE_SOFT_KEY=ON reconfigure > release.log 2>&1; then
            echo "release build accepted the INSECURE soft key"; exit 1
          fi
          grep -q "must never be built in a release configuration" release.log

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No references to the old repo name
        run: |
          # [-] so this file doesn't match its own pattern.
          if grep -rn "tiny[-]crypt" --exclude-dir=.git --exclude-dir=third_party .; then
            echo "found the old hyphenated name: the repo is now 'tinycrypt'"; exit 1
          fi

  # ── Firmware publishing (CRYPT-20) ───────────────────────────────────────────────────────────
  # A PR that touches the firmware: compute the next version once, build it once (unsigned), sign
  # that with the sandbox key and publish it to sandbox. Its merge: the same unsigned build, signed
  # with the prod key, to prod. Fleet then offers it; every install still needs the watch.
  firmware-version:
    name: Firmware version
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.free.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SANDBOX_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # The tracker's sandbox latest is the high-water mark; version.txt only seeds it (and labels
      # local builds).
      - name: Seed from version.txt
        run: |
          printf '{"version": "%s"}\n' "$(tr -d '[:space:]' < embedded/esp32s3/version.txt)" > version.json
      - name: Compute version
        id: compute
        uses: nakomis/nakomis-infra/.github/actions/compute-version@main
        env:
          # The bump keyword (alone on a line) is read from the PR, not the synthetic merge commit.
          COMMIT_MESSAGE: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
        with:
          project: tinycrypt
          environment: sandbox
          version-file: version.json
      # A version already in the bucket (published by hand, or a run that failed before recording
      # it) is never reused: step past it.
      - name: Skip versions already published
        id: free
        env:
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          v=$VERSION
          while aws s3api head-object --bucket nakomis-firmware-sandbox --key "tinycrypt/$v/firmware.bin" > /dev/null 2>&1; do
            IFS=. read -r a b c <<< "$v"; v="$a.$b.$((c + 1))"
          done
          [ "$v" = "$VERSION" ] || echo "::notice::$VERSION is already published; using $v"
          printf '{\n  "version": "%s"\n}\n' "$v" > version.json
          echo "version=$v" >> "$GITHUB_OUTPUT"

  firmware-build:
    name: Firmware build
    needs: firmware-version
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    defaults:
      run:
        shell: bash
        working-directory: embedded
    steps:
      - uses: actions/checkout@v4
      - name: Fetch solo1 and the libraries it builds
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init third_party/solo1
          git -C third_party/solo1 submodule update --init crypto/cifra crypto/micro-ecc crypto/tiny-AES-c tinycbor
      - name: Build (unsigned)
        env:
          VERSION: ${{ needs.firmware-version.outputs.version }}
        run: |
          . "$IDF_PATH/export.sh"
          cd esp32s3
          echo "$VERSION" > version.txt
          case "$FIRMWARE_KEYSTORE" in
            soft) keystore=(-DTINYCRYPT_INSECURE_SOFT_KEY=ON) ;;
            atecc) keystore=(-DTINYCRYPT_INSECURE_SOFT_KEY=OFF -DTINYCRYPT_KEYSTORE_ATECC=ON) ;;
            *) echo "FIRMWARE_KEYSTORE must be soft or atecc"; exit 1 ;;
          esac
          idf.py "${keystore[@]}" build
          . tools/image-checks.sh
          check_image_version build/tinycrypt.bin "$VERSION"
          check_image_config build/config/sdkconfig.h false
          check_image_strings build/tinycrypt.bin sandbox
          check_image_strings build/tinycrypt.bin prod
          mkdir -p ../../firmware
          cp build/tinycrypt.bin ../../firmware/tinycrypt-unsigned.bin
          printf '{\n  "version": "%s"\n}\n' "$VERSION" > ../../firmware/version.json
          echo "$FIRMWARE_KEYSTORE" > ../../firmware/keystore
          # What main must hold for the merge to publish these bytes (see firmware-prod).
          git rev-parse 'HEAD^{tree}' > ../../firmware/tree
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/
          if-no-files-found: error

  firmware-sandbox:
    name: Firmware publish (sandbox)
    needs: [firmware-version, firmware-build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - run: pip install --quiet "esptool==${ESPTOOL_VERSION}"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SANDBOX_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Sign and publish
        env:
          VERSION: ${{ needs.firmware-version.outputs.version }}
        run: embedded/esp32s3/tools/ci-publish.sh sandbox firmware/tinycrypt-unsigned.bin "$VERSION"
      - name: Record deployment
        uses: nakomis/nakomis-infra/.github/actions/record-deployment@main
        with:
          project: tinycrypt
          environment: sandbox
          version-file: firmware/version.json

  firmware-prod:
    name: Firmware publish (prod)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      # The merged PR's last successful CI run built (and sandbox published) these bytes, from the
      # same tree main now holds. Anything else (a direct push, main moved on since, a soft-key
      # build) publishes nothing.
      - name: Find the PR's build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          skip() { echo "::notice::$1: nothing published to prod"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; }
          pr=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          [ -n "$pr" ] || skip "not from a PR"
          head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          run=$(gh run list -R "$REPO" --workflow CI --commit "$head" --event pull_request --status success \
                --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$run" ] || skip "PR #$pr has no successful CI run at its head"
          gh run download "$run" -R "$REPO" -n firmware -D firmware 2> /dev/null || skip "PR #$pr published no firmware"
          if [ "$(cat firmware/tree)" != "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "::error::main isn't the tree PR #$pr's build came from (main moved on): re-run its CI, or publish by hand"
            exit 1
          fi
          [ "$(cat firmware/keystore)" = atecc ] || skip "PR #$pr's build uses the $(cat firmware/keystore) keystore; prod takes only ATECC builds"
          echo "version=$(jq -r .version firmware/version.json)" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - if: steps.find.outputs.publish == 'true'
        run: pip install --quiet "esptool==${ESPTOOL_VERSION}"
      - if: steps.find.outputs.publish == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Sign and publish
        if: steps.find.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.find.outputs.version }}
        run: embedded/esp32s3/tools/ci-publish.sh prod firmware/tinycrypt-unsigned.bin "$VERSION"
      - name: Record deployment
        if: steps.find.outputs.publish == 'true'
        uses: nakomis/nakomis-infra/.github/actions/record-deployment@main
        with:
          project: tinycrypt
          environment: prod
          version-file: firmware/version.json

  # The "Protect main" ruleset requires a check with exactly this name.
  infra:
    name: Infra (CDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm run build
      - name: Synth (sandbox and prod)
        run: pnpm run ci-synth-sandbox && pnpm run ci-synth-prod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Register Lambda tests
        run: python -m pip install pytest==8.4.2 && python -m pytest -v lambda

  ci-status:
    name: CI Status
    if: always()
    needs: [changes, mac-sim, esp32s3, watch-app, watch-testflight, infra, lint, firmware-version, firmware-build, firmware-sandbox, firmware-prod]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          # Every job passed; the publishing ones may also be skipped (nothing of theirs changed, or main).
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success"
            or (.value.result == "skipped" and (.key | test("^(firmware-|watch-testflight)"))))' > /dev/null
